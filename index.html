<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARQO</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ARQO">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap">
<style>
:root{--bg:#fff;--fg:#000;--mut:#6a6a6a;--line:#dcdcdc;--soft:#f3f3f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;--mut:#9b9b9b;--line:#2a2a2a;--soft:#141414}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--mut:#9b9b9b;--line:#2a2a2a;--soft:#141414}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 Outfit,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
header svg{display:block}
.menu{letter-spacing:.06em;font-weight:500}
#ov{position:fixed;inset:0;z-index:4;background:var(--bg);display:none;flex-direction:column;justify-content:center;align-items:center;gap:22px;font-size:22px;font-weight:500;letter-spacing:.06em}
#ov.on{display:flex}
main{max-width:720px;margin:0 auto;padding:28px 20px 80px}
.home{min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:36px;text-align:center}
.wm{font-size:clamp(56px,20vw,120px);font-weight:400;letter-spacing:-.02em;margin:0;line-height:1}
.ltr{display:inline-block}
.br{display:inline-block;width:.24em;height:.94em;border:.085em solid currentColor;vertical-align:-.12em}
.br.l{border-right:0;margin-right:.1em}
.br.r{border-left:0;margin-left:.1em}
.o{display:inline-block;width:.73em;height:.73em;border:.085em solid currentColor;border-radius:50%;margin-left:.04em;vertical-align:-.01em}
.pre header,.pre .home nav,.pre .wm{opacity:0}
.home nav{display:flex;flex-direction:column;gap:14px;font-weight:500;letter-spacing:.06em}
h2{font-size:28px;font-weight:500;letter-spacing:-.01em;margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 22px;max-width:48ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{border:1px solid var(--line);padding:6px 14px;border-radius:99px;font-size:14px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}
.card{text-align:left}
.card b{display:block;font-weight:500;margin-top:10px;line-height:1.25}
.card span{color:var(--mut);font-size:14px}
.ph{position:relative;aspect-ratio:4/5;overflow:hidden;background:linear-gradient(var(--g,165deg),var(--a),var(--b))}
.ph::before{content:"";position:absolute;left:16%;bottom:0;width:34%;height:58%;background:rgba(255,255,255,.28)}
.ph::after{content:"";position:absolute;right:14%;bottom:0;width:22%;height:36%;background:rgba(0,0,0,.22)}
.vf{position:absolute;inset:10px;pointer-events:none;--c:#fff}
.vf i{position:absolute;width:16px;height:16px;border:2px solid var(--c)}
.vf i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.vf i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.vf i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.vf i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.ph.big{aspect-ratio:4/3}
.ph.v1::before{left:42%;width:38%;height:70%}
.ph.v1::after{right:auto;left:10%;width:18%;height:30%}
.ph.v2::before{left:8%;width:22%;height:82%}
.ph.v2::after{right:10%;width:40%;height:24%}
.ph.v3::before{left:26%;width:52%;height:40%}
.ph.v3::after{right:8%;width:16%;height:62%}
.gw{position:relative}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.gal::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:center}
.gbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;font-size:14px}
.gbar #gt{color:var(--mut);flex:1}
.dots{display:flex;gap:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--fg)}
.ar{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:36px;font-weight:300;padding:10px 14px;text-shadow:0 0 6px rgba(0,0,0,.45)}
.ar.l{left:4px}
.ar.r{right:4px}
@media(hover:none){.ar{display:none}}
.back{margin-bottom:18px;color:var(--mut)}
.read{border-left:2px solid var(--fg);padding-left:14px;margin:20px 0;max-width:52ch}
.btn{display:inline-block;background:var(--fg);color:var(--bg);padding:12px 20px;font-weight:500;margin-top:8px}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--fg)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row small{display:block;color:var(--mut)}
.tag{font-size:13px;border:1px solid var(--line);padding:3px 10px;border-radius:99px;white-space:nowrap}
.steps{display:flex;margin:22px 0 26px}
.st{flex:1;font-size:13px;color:var(--mut);border-top:3px solid var(--line);padding-top:8px;padding-right:4px}
.st.ok{border-color:var(--fg);color:var(--fg)}
.st.cur{font-weight:600}
label{display:block;margin:16px 0 6px;font-size:14px;color:var(--mut)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);padding:11px 12px;border-radius:0}
textarea{min-height:90px;resize:vertical}
.msg{background:var(--soft);padding:10px 12px;margin:8px 0}
.err{color:var(--fg);font-size:14px;min-height:1.4em;margin:14px 0 0}
.note{font-size:13px;color:var(--mut);margin-top:30px}
</style>
</head>
<body class="pre">
<header>
  <button aria-label="Inicio" onclick="go('home')" id="lg"></button>
  <button class="menu" onclick="tm()" id="mb" aria-expanded="false">[MENU]</button>
</header>
<div id="ov">
  <button onclick="go('proy')">PROYECTOS</button>
  <button onclick="go('enc')">HACER UN ENCARGO</button>
  <button onclick="go('home')">INICIO</button>
</div>
<main id="app"></main>
<script>
const LOGO='<svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true"><path d="M15 8H8v24h7M25 8h7v24h-7" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="20" cy="20" r="4.5" fill="currentColor"/></svg>';
document.getElementById('lg').innerHTML=LOGO;
const WM='<span class="br l"></span><span class="ltr">ARQ</span><span class="o"></span><span class="br r"></span>';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MAIL='arqostudio.es@gmail.com';
// Tras activar FormSubmit, sustituye MAIL por el alias que te dé (oculta tu correo en el código)
const FORM='https://formsubmit.co/ajax/'+MAIL;
const S={v:'home',f:'Todos',p:null,o:null,form:false,pre:''};
function tm(force){const o=$('#ov');const on=force===undefined?!o.classList.contains('on'):force;o.classList.toggle('on',on);$('#mb').setAttribute('aria-expanded',on);$('#mb').textContent=on?'[CERRAR]':'[MENU]'}
function go(v){S.v=v;S.p=null;S.o=null;S.form=false;S.done=null;S.sent=false;tm(false);render();scrollTo(0,0)}
function thumb(p,big,i){i=i||0;return `<div class="ph${big?' big':''} v${i}" style="--a:${p.a};--b:${p.b};--g:${[165,205,135,190][i]}deg"><div class="vf"><i></i><i></i><i></i><i></i></div></div>`}
const CAP={'Fotografía':['Vista general','Detalle de materiales','Interior','Atardecer'],'Render':['Exterior','Recorrido','Interior','Detalle'],'Diseño gráfico':['Composición','Aplicación','Detalle','Serie']};
function gallery(p){
  const cp=CAP[p.c];
  return `<div class="gw"><div class="gal" id="gal" tabindex="0" aria-label="Galería de ${esc(p.t)}" onscroll="gs()" onkeydown="if(event.key==='ArrowRight')gm(1);if(event.key==='ArrowLeft')gm(-1)">${cp.map((c,i)=>`<div class="sl" aria-label="${c}">${thumb(p,1,i)}</div>`).join('')}</div><button class="ar l" aria-label="Imagen anterior" onclick="gm(-1)">[</button><button class="ar r" aria-label="Imagen siguiente" onclick="gm(1)">]</button></div><div class="gbar"><span id="gc">1 / ${cp.length}</span><span id="gt">${cp[0]}</span><span class="dots">${cp.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</span></div>`;
}
function gs(){const g=$('#gal');if(!g)return;const n=g.children.length,i=Math.min(n-1,Math.max(0,Math.round(g.scrollLeft/g.clientWidth)));$('#gc').textContent=(i+1)+' / '+n;$('#gt').textContent=CAP[P[S.p].c][i];document.querySelectorAll('.dots i').forEach((d,k)=>d.classList.toggle('on',k===i))}
function gm(d){const g=$('#gal');g.scrollBy({left:d*g.clientWidth,behavior:'smooth'})}
function render(){
  const m=$('#app');
  if(S.v==='home'){
    m.innerHTML=`<section class="home"><h1 class="wm" aria-label="ARQO">${WM}</h1><nav><button onclick="go('proy')">PROYECTOS</button><button onclick="go('enc')">HACER UN ENCARGO</button></nav></section>`;
  }else if(S.v==='proy'){
    if(S.p!==null){
      const p=P[S.p];
      m.innerHTML=`<button class="back" onclick="S.p=null;render()">Volver a proyectos</button>${gallery(p)}<h2 style="margin-top:18px">${p.t}</h2><div class="sub">${p.c}</div><p class="read">${p.r}</p><button class="btn" onclick="S.pre='Similar a: ${p.t}';S.v='enc';S.form=true;render();scrollTo(0,0)">Encargar algo parecido</button>`;
    }else{
      const cats=['Todos','Fotografía','Render','Diseño gráfico'];
      const list=P.filter(p=>S.f==='Todos'||p.c===S.f);
      m.innerHTML=`<h2>Proyectos</h2><p class="sub">Cada proyecto incluye cómo se ha leído el espacio antes de fotografiarlo o dibujarlo.</p><div class="chips">${cats.map(c=>`<button class="chip${c===S.f?' on':''}" onclick="S.f='${c}';render()">${c}</button>`).join('')}</div><div class="grid">${list.map(p=>`<button class="card" onclick="S.p=${p.id};render();scrollTo(0,0)">${thumb(p)}<b>${p.t}</b><span>${p.c}, 4 imágenes</span></button>`).join('')}</div><p class="note">Proyectos de ejemplo. Se sustituirán por tu trabajo real.</p>`;
    }
  }else if(S.sent){
    m.innerHTML=`<h2>Encargo enviado</h2><p class="sub">Hemos recibido tu encargo. ARQO te contactará en el email que has indicado.</p><button class="btn" onclick="go('proy')">Ver proyectos</button> <button class="btn ghost" onclick="S.sent=false;S.done=null;S.pre='';render()">Hacer otro encargo</button>`;
  }else if(S.done){
    m.innerHTML=`<h2>Encargo preparado</h2><p class="sub">Se abrirá tu aplicación de correo con el mensaje listo. Pulsa enviar allí para que llegue a ARQO.</p><a class="btn" href="mailto:${MAIL}?subject=${encodeURIComponent(S.sub)}&body=${encodeURIComponent(S.done)}">Abrir mi correo</a><p class="sub" style="margin-top:26px">Si no se abre, escribe a ${MAIL} con este texto:</p><div class="msg" style="white-space:pre-wrap">${esc(S.done)}</div><button class="btn ghost" id="cpb" onclick="cp()">Copiar mensaje</button> <button class="btn ghost" onclick="S.done=null;render()">Editar encargo</button>`;
  }else{
    m.innerHTML=`<h2>Hacer un encargo</h2><p class="sub">Cuéntanos qué necesitas y cuándo lo quieres. Al enviarlo, se abrirá tu correo con el mensaje preparado para ARQO.</p>
    <label for="fs">Servicio</label><select id="fs"><option>Fotografía</option><option>Render</option><option>Diseño gráfico</option></select>
    <label for="ft">Título del encargo</label><input id="ft" value="${esc(S.pre)}" placeholder="Ej. Render del salón">
    <label for="fd">Fecha deseada</label><input id="fd" type="date">
    <label for="fn">Notas y referencias</label><textarea id="fn" placeholder="Enlaces, medidas, estilo que buscas"></textarea>
    <label for="fnm">Tu nombre</label><input id="fnm" autocomplete="name">
    <label for="fe">Tu email</label><input id="fe" type="email" autocomplete="email">
    <label for="fp">Teléfono (opcional)</label><input id="fp" type="tel" autocomplete="tel">
    <p class="err" id="er" role="alert"></p>
    <button class="btn" id="sb" onclick="sendO()">Enviar encargo</button>`;
  }
}
async function sendO(){
  const g=id=>$('#'+id).value.trim(),bad=(id,t)=>{$('#er').textContent=t;$('#'+id).focus()};
  if(!g('ft'))return bad('ft','Escribe un título para el encargo.');
  if(!g('fnm'))return bad('fnm','Escribe tu nombre.');
  if(!/^\S+@\S+\.\S+$/.test(g('fe')))return bad('fe','Escribe un email válido para poder responderte.');
  const d=g('fd');
  S.sub='Nuevo encargo: '+g('ft');
  S.done=`Nuevo encargo desde la app de ARQO\n\nServicio: ${g('fs')}\nTítulo: ${g('ft')}\nFecha deseada: ${d||'a definir'}\nNotas: ${g('fn')||'-'}\n\nCliente: ${g('fnm')}\nEmail: ${g('fe')}\nTeléfono: ${g('fp')||'-'}`;
  const b=$('#sb');b.disabled=true;b.textContent='Enviando…';
  try{
    const r=await fetch(FORM,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({_subject:S.sub,_template:'table',name:g('fnm'),email:g('fe'),Servicio:g('fs'),Titulo:g('ft'),Fecha:d||'a definir',Notas:g('fn')||'-',Telefono:g('fp')||'-'})});
    const j=await r.json();
    S.sent=r.ok&&String(j.success)==='true';
  }catch(e){S.sent=false}
  render();scrollTo(0,0);
  if(!S.sent){try{location.href='mailto:'+MAIL+'?subject='+encodeURIComponent(S.sub)+'&body='+encodeURIComponent(S.done)}catch(e){}}
}
function cp(){try{navigator.clipboard.writeText(S.done).then(()=>{$('#cpb').textContent='Copiado'},()=>{})}catch(e){}}
function intro(){
  const B=document.body,w=document.querySelector('#app .wm');
  if(!w||S.v!=='home'||matchMedia('(prefers-reduced-motion: reduce)').matches){B.classList.remove('pre');return}
  const l=w.querySelector('.l'),r=w.querySelector('.r'),o=w.querySelector('.o'),t=w.querySelector('.ltr');
  const fs=parseFloat(getComputedStyle(w).fontSize);
  const wb=w.getBoundingClientRect(),cx=wb.left+wb.width/2;
  const c=e=>{const b=e.getBoundingClientRect();return b.left+b.width/2};
  const xl=`translateX(${cx-.36*fs-c(l)}px)`,xr=`translateX(${cx+.36*fs-c(r)}px)`,xo=`translateX(${cx-c(o)}px) scale(.55)`;
  const D=3400,E='cubic-bezier(.76,0,.2,1)',F={duration:D,fill:'both'};
  const mv=(e,x)=>e.animate([{transform:x,offset:0},{transform:x,offset:.34,easing:E},{transform:'none',offset:.74}],F);
  const A=[];
  A.push(w.animate([{opacity:0,offset:0},{opacity:1,offset:.12},{opacity:1,offset:1}],F));
  A.push(mv(l,xl),mv(r,xr),mv(o,xo));
  A.push(o.animate([{borderWidth:'.365em',offset:0},{borderWidth:'.365em',offset:.58,easing:E},{borderWidth:'.085em',offset:.86}],F));
  A.push(t.animate([{clipPath:'inset(-10% 50% -10% 50%)',opacity:0,offset:0},{clipPath:'inset(-10% 50% -10% 50%)',opacity:0,offset:.5,easing:E},{clipPath:'inset(-10% -5% -10% -5%)',opacity:1,offset:.86}],F));
  const late={duration:D+700,fill:'both'},k=D/(D+700);
  [document.querySelector('header'),document.querySelector('.home nav')].forEach(e=>{
    if(e)A.push(e.animate([{opacity:0,offset:0},{opacity:0,offset:k},{opacity:1,offset:1}],late));
  });
  B.classList.remove('pre');
  document.addEventListener('click',()=>A.forEach(a=>a.finish()),{once:true});
}
render();
setTimeout(()=>document.body.classList.remove('pre'),4500);
Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1200))]).then(intro);
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
